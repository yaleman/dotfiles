[project]
name = "hollowbyte-monitor"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = []

[tool.project.scripts]
"hollowbyte-monitor" = "hollowbyte.monitor_rss:main"

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.ruff]
line-length = 120

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.2",
    "ty>=0.0.70",
]


[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
