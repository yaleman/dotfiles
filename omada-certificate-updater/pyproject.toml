[project]
name = "omada-certificate-updater"
version = "0.1.0"
description = "Keep an Omada switch certificate synchronized with cert-manager"
requires-python = ">=3.13"
dependencies = [
    "cryptography>=50.0.0",
    "kubernetes>=36.0.3",
    "requests>=2.34.2",
]

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.4",
    "ty>=0.0.73",
]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers"

[tool.ruff]
line-length = 120
target-version = "py313"
